name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no direct UI literals
        run: ./scripts/check_no_literals.sh

      - name: Check localization key parity
        run: ./scripts/check_i18n.sh

      - name: Check glass button migration
        run: ./scripts/check_glass_button_migration.sh

  core-tests:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Run native logic tests
        run: make test

  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Build app for iOS device SDK
        # Device-SDK compile: verifies all targets build without needing a
        # simulator runtime on the runner. Signing is disabled.
        run: |
          xcodebuild -project OpenAlarm.xcodeproj -scheme OpenAlarm \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios -jobs 4 CODE_SIGNING_ALLOWED=NO build

      - name: Check ringtones in the built app without a simulator
        run: make test-app-resources APP_BUNDLE_PATH="$PWD/build/ios/Build/Products/Debug-iphoneos/OpenAlarm.app"
