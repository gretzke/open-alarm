name: OpenAlarm
options:
  xcodeVersion: "27.1"
  minimumXcodeGenVersion: 2.44.1
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    DEVELOPMENT_TEAM: 7P7CKKPH5L
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  OpenAlarm:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OpenAlarm
    dependencies:
      - target: OpenAlarmLiveActivities
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gretzke.openalarm
        PRODUCT_NAME: OpenAlarm
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.0
        CURRENT_PROJECT_VERSION: 112
        MARKETING_VERSION: 1.2.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenAlarm/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenAlarm/OpenAlarm.entitlements
        LOCALIZATIONS: "en de"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  OpenAlarmLiveActivities:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OpenAlarmLiveActivities
      - path: OpenAlarm/LiveActivities/AlarmSoundLiveActivityAttributes.swift
      - path: OpenAlarm/LiveActivities/NapCountdownLiveActivityManager.swift
      - path: OpenAlarm/LiveActivities/NapCountdownLiveActivityAttributes.swift
      - path: OpenAlarm/Shared/OpenAlarmSharedDefaults.swift
      - path: OpenAlarm/Shared/BackstopSlotStore.swift
      - path: OpenAlarm/Shared/LastRingtoneStore.swift
      - path: OpenAlarm/Shared/IntentDiagnostics.swift
      - path: OpenAlarm/Models/AlarmDefinition.swift
      - path: OpenAlarm/Models/AlarmSettingsBackup.swift
      - path: OpenAlarm/Models/AlarmModels.swift
      - path: OpenAlarm/Models/AlarmSettingsCore.swift
      - path: OpenAlarm/Models/AlertReferenceStore.swift
      - path: OpenAlarm/Models/RingtoneCatalog.swift
      - path: OpenAlarm/Models/AlarmPersistenceStore.swift
      - path: OpenAlarm/Models/PermissionModels.swift
      - path: OpenAlarm/Models/WakeUpCheckModels.swift
      - path: OpenAlarm/Scheduling/AlarmConfigurationBuilder.swift
      - path: OpenAlarm/Scheduling/AlarmScheduling.swift
      - path: OpenAlarm/Scheduling/AlarmIntentLifecycle.swift
      - path: OpenAlarm/Scheduling/AlarmKitScheduler.swift
      - path: OpenAlarm/Theme/OpenAlarmTheme.swift
      - path: OpenAlarm/Intents
        includes:
          - "*.swift"
      - path: OpenAlarm/Resources
        includes:
          - "*.lproj/Localizable.strings"
      - path: OpenAlarm/Resources/Ringtones
        includes:
          - "*.caf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gretzke.openalarm.liveactivities
        PRODUCT_NAME: OpenAlarmLiveActivities
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.0
        CURRENT_PROJECT_VERSION: 112
        MARKETING_VERSION: 1.2.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenAlarmLiveActivities/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenAlarmLiveActivities/OpenAlarmLiveActivities.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  OpenAlarm:
    build:
      targets:
        OpenAlarm: all
    run:
      config: Debug
      debugEnabled: false
    profile:
      config: Release
    archive:
      config: Release
  OpenAlarmLiveActivities:
    build:
      targets:
        OpenAlarmLiveActivities: all
        OpenAlarm: all
    run:
      config: Debug
      executable: OpenAlarm
      debugEnabled: false
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
      environmentVariables:
        _XCWidgetKind: ""
        _XCWidgetDefaultView: timeline
        _XCWidgetFamily: systemMedium
    profile:
      config: Release
      askForAppToLaunch: true
    archive:
      config: Release
